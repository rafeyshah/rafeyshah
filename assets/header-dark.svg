<radialGradient id="g1" cx="0.85" cy="0.1" r="0.55"><stop offset="0" stop-color="#1F6FEB" stop-opacity="0.28"/><stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/></radialGradient>
